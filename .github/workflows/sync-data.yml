name: Sync court data

# Optional alternative to the built-in Vercel Cron (which runs daily).
# Enable the schedule below for 6-hourly freshness after adding the
# TURSO_DATABASE_URL / TURSO_AUTH_TOKEN repository secrets.
on:
  # schedule:
  #   - cron: "17 */6 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
