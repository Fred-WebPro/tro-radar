name: Daily digest

# Watchlist digest and the sweep that covers free-tier portfolios (the 30-minute
# job only alerts Pro accounts). Vercel Cron also runs these daily; this
# workflow is the backup that keeps working if the Vercel schedule is paused.
on:
  schedule:
    - cron: "10 13 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: ${{ vars.SITE_URL || 'https://tro-radar.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Monitor all portfolios
        run: |
          auth=()
          [ -n "$CRON_SECRET" ] && auth=(-H "Authorization: Bearer $CRON_SECRET")
          echo "monitor: $(curl -sS -m 300 "${auth[@]}" "$SITE/api/cron/monitor")"

      - name: Send watchlist digests
        run: |
          auth=()
          [ -n "$CRON_SECRET" ] && auth=(-H "Authorization: Bearer $CRON_SECRET")
          echo "digest: $(curl -sS -m 300 "${auth[@]}" "$SITE/api/cron/digest")"
