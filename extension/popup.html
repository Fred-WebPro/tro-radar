<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      width: 340px; margin: 0; background: #f6f5f1; color: #161512;
    }
    .top { height: 4px; background: #161512; }
    .wrap { padding: 14px; }
    .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .brand b { font-size: 15px; letter-spacing: -0.01em; flex: 1; }
    .gear { color: #898781; text-decoration: none; font-size: 15px; }
    .gear:hover { color: #161512; }
    form { display: flex; gap: 6px; margin-bottom: 12px; }
    input {
      flex: 1; min-width: 0; border: 1px solid #c3c2b7; background: #fcfcfb;
      padding: 8px 10px; font-size: 13px; color: #161512;
    }
    input:focus { outline: none; border-color: #161512; }
    button.go {
      border: none; background: #161512; color: #f6f5f1; padding: 8px 14px;
      font-size: 11px; font-weight: 600; letter-spacing: .1em; cursor: pointer;
    }
    button.go:hover { background: #333; }
    #result { display: none; border: 2px solid #c3c2b7; background: #fcfcfb; padding: 10px 12px; margin-bottom: 12px; }
    #verdict { font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700;
      letter-spacing: .14em; margin: 0 0 4px; }
    #headline { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
    .meter { height: 4px; background: #e3e1d8; margin-bottom: 6px; }
    .meter i { display: block; height: 100%; }
    #stats { font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: #52514e;
      display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 6px; }
    #brands { font-size: 12px; color: #52514e; margin: 0 0 8px; }
    .actions { display: flex; gap: 8px; align-items: center; }
    #watch { border: 1px solid #161512; background: #161512; color: #fcfcfb; font-size: 11px;
      font-weight: 600; padding: 6px 10px; cursor: pointer; }
    #watch[disabled] { background: #fcfcfb; color: #52514e; border-color: #c3c2b7; cursor: default; }
    #link { font-size: 12px; font-weight: 600; color: #1c5cab; text-decoration: none; }
    #link:hover { text-decoration: underline; }
    .section { border-top: 1px solid #e3e1d8; padding-top: 10px; }
    .section h3 { font-family: ui-monospace, Consolas, monospace; font-size: 10px;
      text-transform: uppercase; letter-spacing: .14em; color: #52514e; margin: 0 0 8px; font-weight: 600; }
    .pf-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12px; }
    .pf-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .pf-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pf-n { font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: #898781; }
    .empty { font-size: 12px; color: #898781; line-height: 1.5; }
    .foot { margin-top: 10px; font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: #898781; }
    .foot a { color: #1c5cab; }
  </style>
</head>
<body>
  <div class="top"></div>
  <div class="wrap">
    <div class="brand">
      <b>TRO Radar</b>
      <a class="gear" id="settings" href="#" title="Settings">⚙</a>
    </div>

    <form id="form">
      <input id="q" type="text" placeholder="Brand or product name…" autofocus />
      <button class="go" type="submit" id="checkBtn">CHECK</button>
    </form>

    <div id="result">
      <p id="verdict"></p>
      <p id="headline"></p>
      <div class="meter" id="meterWrap" style="display:none"><i id="meter"></i></div>
      <div id="stats"></div>
      <p id="brands"></p>
      <div class="actions">
        <button id="watch">Watch</button>
        <a id="link" target="_blank" rel="noopener">See all cases →</a>
      </div>
    </div>

    <div class="section">
      <h3 id="pfHeading">Portfolio</h3>
      <div id="portfolio"><p class="empty" id="pfEmpty">Loading…</p></div>
    </div>

    <p class="foot" id="foot">Public court records · not legal advice</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
