<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      width: 320px; margin: 0; background: #f6f5f1; color: #161512;
    }
    .top { height: 4px; background: #161512; }
    .wrap { padding: 14px; }
    .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .brand b { font-size: 15px; letter-spacing: -0.01em; }
    form { display: flex; gap: 6px; margin-bottom: 10px; }
    input {
      flex: 1; min-width: 0; border: 1px solid #c3c2b7; background: #fcfcfb;
      padding: 8px 10px; font-size: 13px; color: #161512;
    }
    input:focus { outline: none; border-color: #161512; }
    button {
      border: none; background: #161512; color: #f6f5f1; padding: 8px 14px;
      font-size: 11px; font-weight: 600; letter-spacing: .1em; cursor: pointer;
    }
    button:hover { background: #333; }
    #result { display: none; border: 2px solid #c3c2b7; background: #fcfcfb; padding: 10px 12px; }
    #verdict { font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700;
      letter-spacing: .14em; margin: 0 0 4px; }
    #headline { font-size: 13px; font-weight: 600; margin: 0 0 4px; }
    #brands { font-size: 12px; color: #52514e; margin: 0 0 8px; }
    #link { font-size: 12px; font-weight: 600; color: #1c5cab; text-decoration: none; }
    #link:hover { text-decoration: underline; }
    .foot { margin-top: 10px; font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: #898781; }
  </style>
</head>
<body>
  <div class="top"></div>
  <div class="wrap">
    <div class="brand"><b>TRO Radar</b></div>
    <form id="form">
      <input id="q" type="text" placeholder="Brand or product name…" autofocus />
      <button type="submit">CHECK</button>
    </form>
    <div id="result">
      <p id="verdict"></p>
      <p id="headline"></p>
      <p id="brands"></p>
      <a id="link" target="_blank" rel="noopener">See all cases →</a>
    </div>
    <p class="foot">Public court records · not legal advice</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
